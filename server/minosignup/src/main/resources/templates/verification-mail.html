<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이메일 인증</title>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff;">
<table width="100%" border="0" cellpadding="0" cellspacing="0" style="margin: 0; padding: 0; width: 100%;">
    <tr>
        <td align="center" style="padding: 20px;">
            <table width="500" border="0" cellpadding="0" cellspacing="0" style="width: 500px; max-width: 100%; font-family: 'Pretendard Variable', 'Apple SD Gothic Neo', 'Malgun Gothic', 'Dotum', sans-serif; line-height: 1.3; letter-spacing: -0.04em;">
                <tr>
                    <td align="center" style="padding-bottom: 20px;">
                        <img src="cid:ensharpLogo" alt="Ensharp Logo" width="250" height="250" style="display: block; width: 250px; height: 250px; border: 0;">
                    </td>
                </tr>
                <tr>
                    <td align="center" style="padding: 20px; border-radius: 15px; border: 1px solid #dcdcdc; background-color: #ffffff;">
                        <table width="100%" border="0" cellpadding="0" cellspacing="0">
                            <tr>
                                <td align="center" style="padding-bottom: 15px;">
                                    <h2 style="margin: 0;">En# 이메일 인증 안내</h2>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" style="padding-bottom: 20px;">
                                    <p style="margin: 0 0 8px 0;">세종대학교 En# 에 오신 것을 환영합니다!</p>
                                    <p style="margin: 0 0 8px 0;">안전한 회원가입을 위해서는 이메일 인증이 필요합니다.</p>
                                    <p style="margin: 0;">아래의 인증번호를 입력란에 정확히 입력해주세요.</p>
                                </td>
                            </tr>

                            <tr>
                                <td align="center" style="padding-bottom: 20px;">
                                    <h1 style="margin: 0; font-size: 32px;" th:text="${verificationCode}"></h1>
                                </td>
                            </tr>

                            <tr>
                                <td align="center">
                                    <p style="margin: 0;">
                                        해당 인증번호는 <strong th:text="${#temporals.format(expiredAt, 'yyyy-MM-dd HH시 mm분 ss초')}"></strong> 까지 유효합니다.
                                    </p>
                                </td>
                            </tr>
                        </table>

                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
