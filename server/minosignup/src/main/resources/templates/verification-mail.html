<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div style="display:flex; flex-direction: column; place-items: center; width: 500px; height: auto; padding: 20px; font-family: 'Pretendard Variable'; line-height: 130%; letter-spacing: -0.04em; gap: 8px">
            <img
                    src="cid:ensharpLogo"
                    style="width: 250px; height: 250px;"
            >

            <div style="display: flex; flex-direction: column; width: auto; height: auto; border-radius: 15px; border-width: 2px; padding: 20px 20px; border: 1px solid #8984842E; gap: 8px">
                <h2 style="text-align: center">En# 이메일 인증 안내</h2>

                <p>세종대학교 En# 에 오신 것을 환영합니다!</p>
                <p>안전한 회원가입을 위해서는 이메일 인증이 필요합니다.</p>
                <p>아래의 인증번호를 입력란에 정확히 입력해주세요.</p>

                <br>
                <h1 style="text-align: center" th:text="${verificationCode}"></h1>
                <br>

                <p style="text-align: center">
                    해당 인증번호는 <strong th:text="${#temporals.format(expiredAt, 'yyyy-MM-dd HH시 mm분 ss초')}"></strong> 까지 유효합니다.
                </p>

            <br>
            </div>
        </div>
    </body>
</html>
