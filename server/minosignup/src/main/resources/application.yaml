spring:
  application:
    name: minosignup
  jpa:
    database: ${JPA_DATABASE}
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: ${DATASOURCE_DRIVER_CLASS_NAME}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  gemini:
    api-key: ${GEMINI_API_KEY}